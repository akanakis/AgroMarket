name: Backend CI

on:
  push:
    paths:
      - 'backend/**'
  pull_request:
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx flake8
          
      - name: Lint with flake8
        run: |
          flake8 . --exclude=.venv,venv,env,.env --count --select=E9,F63,F7,F82 --show-source --statistics
          
      - name: Run tests
        env:
          DATABASE_URL: sqlite:///./test.db
          SECRET_KEY: test_secret_key
          STRIPE_SECRET_KEY: dummy_test_key
          STRIPE_WEBHOOK_SECRET: dummy_webhook_secret
        run: |
          pytest
